<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character silhouette comparison</title><style>body{margin:0;background:#ccd0d3;color:#20231e;font:14px system-ui}header{position:fixed;top:24px;left:24px;z-index:2}button{padding:10px;margin-right:8px}p{max-width:500px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script><header><b id="status">Loading both character assets…</b><p><button id="version">Show original</button><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button></p></header><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#ccd0d3');scene.add(new T.HemisphereLight(0xffffff,0x717987,1.8));const key=new T.DirectionalLight(0xffffff,3.2);key.position.set(-4,7,6);scene.add(key);const rim=new T.DirectionalLight(0xcdd6ff,1.4);rim.position.set(4,3,-3);scene.add(rim);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,.25,7.3);camera.lookAt(0,0,0);const root=new T.Group();root.rotation.set(.506,0,.052);scene.add(root);const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);const models=[];let revised=true;
for(const name of ['concrete-blob-web.glb','concrete-blob-rounded.glb']){const g=await loader.loadAsync('../assets/'+name+'?shape=5');const b=new T.Box3().setFromObject(g.scene),ref=g.parser.json.asset.extras?.referenceFrame,center=ref?new T.Vector3(...ref.center):b.getCenter(new T.Vector3()),scale=3.6/(ref?.height??b.getSize(new T.Vector3()).y);g.scene.scale.setScalar(scale);g.scene.position.copy(center.multiplyScalar(-scale));root.add(g.scene);models.push(g.scene);}
function render(){models[0].visible=!revised;models[1].visible=revised;document.querySelector('#status').textContent=revised?'Revised — rounded lower silhouette':'Original — lower protrusions';document.querySelector('#version').textContent=revised?'Show original':'Show revised';renderer.render(scene,camera);}
document.querySelector('#version').onclick=()=>{revised=!revised;render()};for(const [id,angle]of [['front',0],['side',Math.PI/2],['back',Math.PI]])document.querySelector('#'+id).onclick=()=>{root.rotation.y=angle;render()};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()};render();
</script></html>
