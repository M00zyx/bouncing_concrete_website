<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouncing Concrete release artwork</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#1736df;color:#e9e9e0;font-family:'DM Mono',monospace}
    .card{position:relative;width:100vw;height:100vh;overflow:hidden;background:#1736df url('/assets/poster-grit.webp') center/cover;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
    .wordmark{width:580px;max-width:60%;height:auto;position:relative;z-index:2}
    .face{position:absolute;right:6%;top:9%;width:24%;transform:rotate(12deg);filter:drop-shadow(6px 10px 8px #0007)}
    .flower{position:absolute;right:19%;bottom:16%;width:13%;transform:rotate(-10deg);filter:drop-shadow(6px 10px 8px #0007)}
    .copy{position:absolute;left:72px;bottom:58px;z-index:2}.copy p{font-size:16px;letter-spacing:.08em;margin:0 0 14px}.copy h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:72px;line-height:1;margin:0}.copy span{display:block;font-size:14px;margin-top:18px;color:#ffd900}
    .location{position:absolute;right:64px;bottom:58px;text-align:right;font-size:12px;line-height:1.7}
    @media(max-aspect-ratio:1/1){.card{padding:110px 84px}.wordmark{width:100%;max-width:none;margin-top:220px}.face{width:27%;top:7%;right:12%}.flower{width:21%;right:15%;bottom:30%}.copy{left:84px;bottom:300px;margin-bottom:0}.copy p{font-size:24px}.copy h1{font-size:118px}.copy span{font-size:25px}.location{bottom:90px;right:84px;font-size:20px}}
  </style>
</head>
<body><main class="card"><img class="wordmark" src="/assets/wordmark-gritty.webp" alt="Bouncing Concrete"><img class="face" src="/assets/ornament-face.webp" alt=""><img class="flower" src="/assets/ornament-flower.webp" alt=""><div class="copy"><p>FEATURED TRACK</p><h1>Funkacaine</h1><span>LISTEN ON SOUNDCLOUD ↗</span></div><div class="location">KUALA LUMPUR<br>3.1390° N · 101.6869° E</div></main><script>const titles = {'funkacaine':'Funkacaine','concreto-incarnat':'Concreto Incarnat'}; const title=titles[new URLSearchParams(location.search).get('track')]; if(title){document.querySelector('h1').textContent=title;document.querySelector('.copy p').textContent='BOUNCING CONCRETE';document.querySelector('h1').style.fontSize='68px';}</script></body>
</html>
